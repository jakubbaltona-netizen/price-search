<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wyszukiwarka cen | Baltona Shipchandlers</title><style>
:root{--navy:#081a35;--blue:#1167d8;--bg:#f4f7fb;--card:#fff;--line:#dce5f0;--muted:#607086;--text:#10213b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--navy) 0 220px,var(--bg) 220px);font-family:Segoe UI,Arial,sans-serif;color:var(--text);min-height:100vh}#app{max-width:1180px;margin:auto;padding:36px 22px}.top{display:flex;justify-content:space-between;gap:20px;color:#fff;margin-bottom:28px}.eyebrow{font-size:12px;letter-spacing:.15em;color:#9fc6ff;font-weight:700}.top h1{font-size:48px;margin:7px 0 5px}.top p{margin:0;color:#c7d7ec}.headActions{display:flex;gap:9px;align-items:flex-start}.cartBtn,.status{border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:10px 13px}.cartBtn{background:#fff;color:var(--navy);font-weight:800;cursor:pointer}.badge{background:var(--blue);color:#fff;border-radius:999px;padding:3px 7px;margin-left:5px}.status{font-size:13px;background:rgba(255,255,255,.1)}.panel{background:white;border-radius:18px;padding:24px;box-shadow:0 12px 30px rgba(0,0,0,.08)}label{font-size:14px;font-weight:700}.searchBox{display:flex;border:2px solid var(--line);border-radius:13px;margin-top:9px}.searchBox:focus-within{border-color:var(--blue)}input[type=search]{width:100%;border:0;outline:0;padding:15px;font-size:18px;border-radius:13px}.clear{border:0;background:none;font-size:28px;color:#7a8798;padding:0 15px;cursor:pointer}.summary{padding:18px 4px 10px;color:#405169}.results{display:grid;gap:10px}.card{background:white;border:1px solid #d8e2ed;border-radius:14px;padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;box-shadow:0 2px 9px rgba(8,26,53,.035)}.code{font:700 13px monospace;color:var(--blue);letter-spacing:.02em}.pl{font-weight:800;margin:8px 0 5px;font-size:20px;line-height:1.24;color:#10213b}.eng{color:#4c5e74;font-size:17px;line-height:1.34;font-weight:500}.unit{display:inline-block;margin-top:10px;background:#eef3f8;border-radius:999px;padding:4px 8px;font-size:11px;color:#5b6c80}.prices{text-align:right;min-width:245px;display:flex;flex-direction:column;justify-content:center}.mainPrice{font-size:29px;font-weight:850;line-height:1.1;color:#081a35}.other{color:#718096;font-size:13px;margin-top:5px}.buttons{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;margin-top:12px;max-width:315px;margin-left:auto}.btn{border:1px solid #c5d5e8;background:#fff;color:#0b4fae;padding:6px 8px;border-radius:7px;font-size:11px;line-height:1.15;font-weight:700;cursor:pointer;white-space:nowrap}.add{background:var(--blue);color:#fff;border-color:var(--blue);padding:7px 9px;font-size:11px}.modal[hidden]{display:none}.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:15px}.backdrop{position:absolute;inset:0;background:rgba(4,15,30,.65)}.cart{position:relative;background:var(--bg);width:min(960px,100%);max-height:90vh;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}.cartHead{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:20px;border-bottom:1px solid var(--line)}.cartHead h2{margin:3px 0}.close{border:0;border-radius:50%;width:38px;height:38px;font-size:25px;cursor:pointer}.cartItems{padding:14px;display:grid;gap:8px;overflow:auto}.row{display:grid;grid-template-columns:1fr 80px 125px 125px 36px;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.row small{display:block;color:var(--muted);margin-top:3px}.qty{width:70px;border:1px solid var(--line);border-radius:8px;padding:8px}.sum{text-align:right;font-weight:750}.remove{border:0;background:#fff0f0;color:#b42318;border-radius:8px;width:34px;height:34px;font-size:20px;cursor:pointer}.cartFoot{display:flex;justify-content:flex-end;align-items:center;gap:22px;background:#fff;border-top:1px solid var(--line);padding:15px 20px}.tot span{display:block;color:var(--muted);font-size:11px}.tot strong{font-size:19px}.danger{border:1px solid #efb3ae;background:#fff;color:#b42318;border-radius:9px;padding:9px 11px;font-weight:700;cursor:pointer}.empty{text-align:center;padding:35px;color:var(--muted)}footer{color:#718096;font-size:12px;padding:24px 4px}@media(max-width:700px){#app{padding:24px 14px}.top{display:block}.top h1{font-size:36px}.headActions{margin-top:15px;flex-wrap:wrap}.card{grid-template-columns:1fr}.prices{text-align:left;min-width:0;border-top:1px solid var(--line);padding-top:12px}.buttons{justify-content:flex-start;max-width:none;margin-left:0}.btn{font-size:11px;padding:6px 7px}.row{grid-template-columns:1fr 70px 36px}.sum{grid-column:1/2;text-align:left}.cartFoot{flex-direction:column;align-items:stretch}.danger{width:100%}}
</style></head><body><div id="app"><header class="top"><div><div class="eyebrow">BALTONA SHIPCHANDLERS · SZCZECIN</div><h1>Wyszukiwarka cen</h1><p>Cennik Cabin Store · główna cena EUR</p></div><div class="headActions"><button id="openCart" class="cartBtn">Notatnik <span id="cartCount" class="badge">0</span></button><div id="dataStatus" class="status">Ładowanie danych…</div></div></header><main><section class="panel"><label for="search">Wpisz kod albo nazwę produktu po polsku lub angielsku</label><div class="searchBox"><input id="search" type="search" autocomplete="off" placeholder="np. tytan, ręcznik, A87412…"><button id="clear" class="clear">×</button></div></section><div class="summary"><strong id="count">Wpisz minimum 2 znaki</strong></div><section id="results" class="results"></section></main><div id="modal" class="modal" hidden><div class="backdrop" id="backdrop"></div><section class="cart"><div class="cartHead"><div><div class="eyebrow" style="color:#1167d8">WYBRANE POZYCJE</div><h2>Notatnik cen</h2></div><button id="closeCart" class="close">×</button></div><div id="cartItems" class="cartItems"></div><div class="cartFoot"><div class="tot"><span>RAZEM EUR</span><strong id="totalEur">0,00 EUR</strong></div><div class="tot"><span>RAZEM PLN</span><strong id="totalPln">0,00 PLN</strong></div><button id="clearCart" class="danger">Wyczyść notatnik</button></div></section></div><footer>Baltona Shipchandlers Szczecin Branch</footer></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let products=[],cart=[];try{cart=JSON.parse(localStorage.getItem('baltonaNotebook')||'[]')}catch{cart=[]}const norm=s=>(s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const esc=s=>(s||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=(n,c)=>new Intl.NumberFormat('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' '+c;const raw=n=>new Intl.NumberFormat('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);function save(){localStorage.setItem('baltonaNotebook',JSON.stringify(cart));renderCart()}function add(p){let x=cart.find(x=>x.code===p.code);if(x)x.qty++;else cart.push({...p,qty:1});save()}function renderCart(){const qty=cart.reduce((a,x)=>a+x.qty,0);$('#cartCount').textContent=qty;const box=$('#cartItems');if(!cart.length){box.innerHTML='<div class="empty">Notatnik jest pusty. Wyszukaj produkt i kliknij „Dodaj do notatnika”.</div>';$('#totalEur').textContent=money(0,'EUR');$('#totalPln').textContent=money(0,'PLN');return}box.innerHTML=cart.map((x,i)=>`<div class="row"><div><strong>${esc(x.descriptionEng)}</strong><small>${esc(x.code)} · ${esc(x.unit)}</small></div><input class="qty" data-i="${i}" type="number" min="1" max="9999" value="${x.qty}"><div class="sum">${money(x.priceEur*x.qty,'EUR')}</div><div class="sum">${money(x.pricePln*x.qty,'PLN')}</div><button class="remove" data-i="${i}">×</button></div>`).join('');$('#totalEur').textContent=money(cart.reduce((a,x)=>a+x.priceEur*x.qty,0),'EUR');$('#totalPln').textContent=money(cart.reduce((a,x)=>a+x.pricePln*x.qty,0),'PLN');$$('.qty').forEach(e=>e.onchange=()=>{cart[+e.dataset.i].qty=Math.max(1,Math.min(9999,Math.round(+e.value||1)));save()});$$('.remove').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.i,1);save()})}function copy(text,b,label){navigator.clipboard.writeText(text).then(()=>{b.textContent='Skopiowano';setTimeout(()=>b.textContent=label,900)}).catch(()=>{})}function render(){let q=$('#search').value.trim();if(q.length<2){$('#count').textContent='Wpisz minimum 2 znaki';$('#results').innerHTML='';return}const terms=norm(q).split(/\s+/).filter(Boolean),rows=products.filter(p=>terms.every(t=>norm([p.code,p.descriptionPl,p.descriptionEng].join(' ')).includes(t))).slice(0,100);$('#count').textContent=rows.length?`${rows.length} wyników`:'Brak wyników';$('#results').innerHTML=rows.length?rows.map((p,i)=>`<article class="card"><div><div class="code">${esc(p.code)}</div><div class="pl">${esc(p.descriptionPl)}</div><div class="eng">${esc(p.descriptionEng)}</div><span class="unit">${esc(p.unit)}</span></div><div class="prices"><div class="mainPrice">${money(p.priceEur,'EUR')}</div><div class="other">${money(p.pricePln,'PLN')}</div><div class="buttons"><button class="btn add" data-add="${i}">+ Dodaj do notatnika</button><button class="btn name" data-i="${i}">Kopiuj nazwę</button><button class="btn eur" data-i="${i}">Kopiuj cenę EUR</button><button class="btn pln" data-i="${i}">Kopiuj cenę PLN</button></div></div></article>`).join(''):'<div class="empty">Nie znaleziono produktu.</div>';$$('[data-add]').forEach(b=>b.onclick=()=>{add(rows[+b.dataset.add]);b.textContent='Dodano ✓';setTimeout(()=>b.textContent='+ Dodaj do notatnika',800)});$$('.name').forEach(b=>b.onclick=()=>copy(rows[+b.dataset.i].descriptionEng,b,'Kopiuj nazwę'));$$('.eur').forEach(b=>b.onclick=()=>copy(raw(rows[+b.dataset.i].priceEur),b,'Kopiuj cenę EUR'));$$('.pln').forEach(b=>b.onclick=()=>copy(raw(rows[+b.dataset.i].pricePln),b,'Kopiuj cenę PLN'))}$('#search').oninput=render;$('#clear').onclick=()=>{$('#search').value='';render();$('#search').focus()};$('#openCart').onclick=()=>{$('#modal').hidden=false;renderCart()};$('#closeCart').onclick=$('#backdrop').onclick=()=>$('#modal').hidden=true;$('#clearCart').onclick=()=>{cart=[];save()};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').hidden=true});renderCart();fetch('prices.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{products=d.products||[];$('#dataStatus').textContent=`${products.length} produktów`;$('#search').focus()}).catch(()=>$('#dataStatus').textContent='Błąd prices.json')})();
</script></body></html>
