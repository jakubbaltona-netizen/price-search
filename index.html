<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081a35"><title>Wyszukiwarka cen | Baltona Shipchandlers</title></head><body><div id="app">
  <header class="top">
    <div><div class="eyebrow">BALTONA SHIPCHANDLERS · SZCZECIN</div><h1>Wyszukiwarka cen</h1><p>Cennik Cabin Store · ceny sprzedaży PLN i EUR</p></div>
    <div class="status"><span id="dot"></span><span id="dataStatus">Ładowanie danych…</span></div>
  </header>
  <main>
    <section class="searchPanel">
      <label for="search">Wpisz kod albo nazwę produktu po polsku lub angielsku</label>
      <div class="searchBox"><span class="glass">⌕</span><input id="search" type="search" autocomplete="off" placeholder="np. tytan, ręcznik, A87412…"><button type="button" id="clear" title="Wyczyść">×</button></div>
      <div class="controls">
        <label class="currency">Główna cena <select id="currency"><option value="EUR">EUR</option><option value="PLN">PLN</option></select></label>
      </div>
    </section>
    <div class="summary"><strong id="resultCount">Wpisz minimum 2 znaki</strong><span id="hint">Wyszukiwanie obejmuje kod oraz oba opisy.</span></div>
    <section id="results" class="results" aria-live="polite"></section>
  </main>
  <footer><span>Baltona Shipchandlers Szczecin Branch</span><span id="updated"></span></footer>
</div>
<style>
:root{color-scheme:light;--navy:#081a35;--blue:#1167d8;--blue2:#0b4fae;--bg:#f4f7fb;--card:#fff;--line:#dce5f0;--muted:#607086;--text:#10213b;--green:#14804a;--shadow:0 12px 30px rgba(8,26,53,.08)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--navy) 0 220px,var(--bg) 220px);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);min-height:100vh}#app{max-width:1180px;margin:auto;padding:36px 22px 24px}.top{color:white;display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:28px}.eyebrow{font-size:12px;letter-spacing:.16em;font-weight:700;color:#9fc6ff}.top h1{font-size:clamp(32px,5vw,52px);margin:7px 0 5px;line-height:1}.top p{margin:0;color:#c7d7ec}.status{display:flex;gap:9px;align-items:center;font-size:13px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);padding:10px 13px;border-radius:999px;white-space:nowrap}.status #dot{width:9px;height:9px;border-radius:50%;background:#f6b73c}.status.ready #dot{background:#45d483}.searchPanel{background:var(--card);border-radius:18px;padding:24px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.8)}label{display:block;font-weight:650;font-size:14px}.searchBox{margin-top:9px;border:2px solid var(--line);border-radius:13px;display:flex;align-items:center;background:white;transition:.2s}.searchBox:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(17,103,216,.11)}.glass{font-size:28px;color:var(--blue);padding:0 0 3px 15px;transform:rotate(-20deg)}input{border:0;outline:0;width:100%;font-size:18px;padding:15px 12px;background:transparent;color:var(--text)}#clear{border:0;background:transparent;font-size:28px;color:#7a8798;padding:5px 15px;cursor:pointer}.controls{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:16px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#f9fbfe;color:var(--text);padding:9px 13px;border-radius:999px;font-weight:650;cursor:pointer}.filter.active{background:#e8f1ff;color:var(--blue2);border-color:#a9c9f5}.currency{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--muted)}select{border:1px solid var(--line);border-radius:9px;background:white;padding:8px 10px;font-weight:700;color:var(--text)}.summary{display:flex;justify-content:space-between;gap:15px;padding:23px 4px 12px}.summary #hint{font-size:13px;color:var(--muted)}.results{display:grid;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;box-shadow:0 4px 16px rgba(8,26,53,.035)}.code{font:700 13px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--blue);letter-spacing:.02em}.pl{font-weight:750;margin:7px 0 4px;font-size:16px}.eng{font-size:14px;color:var(--muted)}mark{background:#fff0a8;color:inherit;padding:0 1px;border-radius:2px}.meta{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}.pill{font-size:12px;background:#eef3f8;color:#4b5e74;padding:5px 8px;border-radius:999px}.stock{background:#e7f7ee;color:var(--green)}.prices{text-align:right;min-width:190px;display:flex;flex-direction:column;justify-content:center}.priceMain{font-size:25px;font-weight:820;color:var(--navy)}.priceOther{font-size:14px;color:var(--muted);margin-top:3px}.copy{margin-top:11px;border:1px solid #b9cee8;color:var(--blue2);background:white;padding:8px 11px;border-radius:9px;font-weight:700;cursor:pointer}.copy:hover{background:#eef5ff}.empty{background:white;border:1px dashed #bfcde0;border-radius:15px;padding:38px;text-align:center;color:var(--muted)}footer{display:flex;justify-content:space-between;color:#718096;font-size:12px;padding:26px 4px 0}@media(max-width:700px){body{background:linear-gradient(180deg,var(--navy) 0 250px,var(--bg) 250px)}#app{padding:25px 14px}.top{display:block}.status{display:inline-flex;margin-top:16px}.searchPanel{padding:17px}.controls,.summary{align-items:flex-start;flex-direction:column}.card{grid-template-columns:1fr}.prices{text-align:left;min-width:0;border-top:1px solid var(--line);padding-top:13px}.copy{width:100%}footer{flex-direction:column;gap:5px}}
</style>
<script>
(()=>{'use strict';const root=document.getElementById('app');let products=[];const $=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)];const norm=s=>(s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const money=(n,c)=>new Intl.NumberFormat('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' '+c;const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function highlight(s,q){if(!q)return esc(s);const words=norm(q).split(/\s+/).filter(Boolean);let safe=esc(s);for(const w of words){if(w.length<2)continue;const i=norm(safe).indexOf(w);if(i>=0)safe=safe.slice(0,i)+'<mark>'+safe.slice(i,i+w.length)+'</mark>'+safe.slice(i+w.length)}return safe}function render(){const q=$('#search').value.trim(),cur=$('#currency').value;if(q.length<2){$('#resultCount').textContent='Wpisz minimum 2 znaki';$('#results').innerHTML='';return}const terms=norm(q).split(/\s+/).filter(Boolean);let rows=products.filter(p=>terms.every(t=>norm([p.code,p.descriptionPl,p.descriptionEng].join(' ')).includes(t)));rows=rows.slice(0,100);$('#resultCount').textContent=rows.length?`${rows.length} ${rows.length===1?'wynik':'wyników'}`:'Brak wyników';if(!rows.length){$('#results').innerHTML='<div class="empty">Nie znaleziono produktu. Spróbuj fragmentu nazwy, kodu albo opisu angielskiego.</div>';return}$('#results').innerHTML=rows.map((p,i)=>{const main=cur==='PLN'?money(p.pricePln,'PLN'):money(p.priceEur,'EUR'),other=cur==='PLN'?money(p.priceEur,'EUR'):money(p.pricePln,'PLN');return `<article class="card"><div><div class="code">${highlight(p.code,q)}</div><div class="pl">${highlight(p.descriptionPl,q)}</div><div class="eng">${highlight(p.descriptionEng,q)}</div><div class="meta"><span class="pill">${esc(p.unit)}</span></div></div><div class="prices"><div class="priceMain">${main}</div><div class="priceOther">${other}</div><button type="button" class="copy" data-i="${i}">Kopiuj pozycję</button></div></article>`}).join('');$$('.copy').forEach((b,i)=>b.addEventListener('click',async()=>{const p=rows[i],text=`${p.code} | ${p.descriptionEng} | ${p.unit} | ${money(p.priceEur,'EUR')} | ${money(p.pricePln,'PLN')}`;try{await navigator.clipboard.writeText(text);b.textContent='Skopiowano';setTimeout(()=>b.textContent='Kopiuj pozycję',1200)}catch{b.textContent='Nie można skopiować'}}))}$('#search').addEventListener('input',render);$('#currency').addEventListener('change',render);$('#clear').addEventListener('click',()=>{$('#search').value='';$('#search').focus();render()});fetch('prices.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{products=data.products||[];$('#dataStatus').textContent=`${products.length} produktów`;$('header').classList.add('ready');$('#updated').textContent=`Aktualizacja danych: ${data.updated||'—'}`;$('#search').focus()}).catch(()=>{$('#dataStatus').textContent='Błąd wczytywania prices.json';$('#results').innerHTML='<div class="empty">Nie udało się wczytać danych. Upewnij się, że pliki index.html i prices.json znajdują się w tym samym folderze na GitHub Pages.</div>'})})();
</script></body></html>
